version: '3.8'

services:
  # Le service de base de données MySQL
  db:
    image: mysql:8.0
    container_name: tawhid-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tawhid_db
    ports:
      - "3307:3306" # On utilise 3307 pour ne pas entrer en conflit avec XAMPP
    volumes:
      - mysql_data:/var/lib/mysql

  # Le service de l'application Spring Boot
  app:
    build: .
    container_name: tawhid-app
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - db

volumes:
  mysql_data: