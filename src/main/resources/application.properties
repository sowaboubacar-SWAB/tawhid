server.port=8080
spring.application.name=Tawhid
spring.docker.compose.enabled=false

# Connexion à la base MySQL de XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/tawhid_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Taille max pour un seul fichier (ex: 50MB)
spring.servlet.multipart.max-file-size=150MB

# Taille max pour toute la requête (ex: 1000MB pour être large)
spring.servlet.multipart.max-request-size=500MB

file.upload-dir=uploads/