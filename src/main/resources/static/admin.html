<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tawhid - Administration</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-container">
    <header>
        <h1>⚙️ Administration</h1>
        <div class="user-info">
            <button onclick="window.location.href='/index.html'" style="background: #555; width: auto; padding: 8px 15px; font-size: 14px;">Retour</button>
            <button onclick="logout()" class="logout-btn">Déconnexion</button>
        </div>
    </header>

    <main>
        <!-- Section 1 : Gestion des Playlists -->
        <section class="admin-section">
            <h2>📁 Gestion des Playlists</h2>
            <input type="text" id="new-playlist-title" placeholder="Titre de la playlist">
            <input type="text" id="new-playlist-desc" placeholder="Description (optionnel)">
            <button onclick="creerPlaylist()">Créer la playlist</button>
        </section>

        <!-- Section 2 : Vidéos YouTube -->
        <section class="admin-section">
            <h2>🎬 Vidéos YouTube</h2>
            <p style="color: #888; font-size: 14px; margin-bottom: 15px;">Ajoutez des vidéos via leur ID YouTube ou importez une playlist complète.</p>

            <select id="playlist-select">
                <option value="">Sélectionnez une playlist</option>
            </select>

            <input type="text" id="new-video-title" placeholder="Titre de la vidéo">
            <input type="text" id="new-video-youtube-id" placeholder="ID YouTube (ex: dQw4w9WgXcQ)">
            <button onclick="ajouterVideo()">Ajouter la vidéo</button>

            <hr style="border-color: #282828; margin: 20px 0;">

            <button onclick="importerPlaylistYouTube()" style="background: #ff9800;">📥 Importer une playlist YouTube</button>
            <div id="imported-videos-container" style="margin-top: 15px;"></div>
            <button id="import-btn-confirm" onclick="confirmerImportation()" style="display: none; background: #4CAF50; margin-top: 10px;">Ajouter les vidéos sélectionnées</button>
        </section>

        <!-- Section 3 : Audios Natifs (Multi-upload) -->
        <section class="admin-section">
            <h2>🎧 Mes Audios (MP3)</h2>
            <p style="color: #888; font-size: 14px; margin-bottom: 15px;">Uploadez un ou plusieurs fichiers MP3 en une seule fois.</p>

            <select id="audio-playlist-select">
                <option value="">Sélectionnez une playlist</option>
            </select>

            <input type="text" id="audio-title" placeholder="Titre (optionnel : laissez vide pour utiliser le nom du fichier)">
            <input type="text" id="audio-artist" placeholder="Artiste (optionnel)">
            <input type="file" id="audio-file" accept="audio/*" multiple>
            <button onclick="uploadAudio()">Uploader le(s) audio(s)</button>
        </section>

        <!-- Section 4 : Gestion des vidéos existantes -->
        <section class="admin-section">
            <h2>🗑️ Gérer les vidéos existantes</h2>
            <select id="playlist-select-manage" onchange="chargerVideosAdmin()">
                <option value="">Sélectionnez une playlist</option>
            </select>
            <div id="admin-video-list" style="margin-top: 15px;"></div>
        </section>

        <!-- Section 5 : Utilisateurs -->
        <section class="admin-section">
            <h2>👥 Utilisateurs inscrits</h2>
            <button onclick="chargerUtilisateurs()" style="margin-bottom: 15px;">Rafraîchir la liste</button>
            <div id="users-list" style="margin-top: 15px;"></div>
        </section>
    </main>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
